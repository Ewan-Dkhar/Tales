[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haunt"
version = "0.1.0"
description = "Narrate process crashes as ghost stories with a local open-weight model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tales" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "ollama>=0.3",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
llama = ["llama-cpp-python>=0.2"]

[project.scripts]
haunt = "haunt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["haunt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
